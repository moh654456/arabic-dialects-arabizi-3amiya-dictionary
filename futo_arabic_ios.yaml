name: "العربية (iPhone)"
description: "Arabic letters placed like the iPhone keyboard."
languages: ar
attributes: {moreKeyMode: OnlyExplicit}
rows:
  - letters: ["ض", "ص", "ث", ["ق", "ڨ"], ["ف", "ڤ"], "غ", "ع", "ه", "خ", "ح", ["ج", "چ"]]
  - letters: ["ش", "س", ["ي", "ئ", "ى"], ["ب", "پ"], ["ل", "ﻻ|لا", "ﻷ|لأ", "ﻹ|لإ", "ﻵ|لآ"], ["ا", "آ", "أ", "إ", "ء"], "ت", "ن", "م", ["ك", "گ"], ["ة", "ه"]]
  - letters: [["ء", "أ", "إ", "ؤ", "ئ"], "ظ", "ط", "ذ", "د", ["ز", "ژ"], "ر", ["و", "ؤ"], ["ى", "ئ", "ي"], "$delete"]
  - bottom: "$symbols $action $space $enter"
